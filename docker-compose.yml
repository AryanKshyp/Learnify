# Local PostgreSQL for development. Not required to run the test suite - Layer 3 is pure and
# touches no database, so the engine work in Stages 1-3 needs nothing here. Storage lands at
# Stage 2. Chosen over SQLite because the deployment target is Supabase, which is Postgres.
#
#   docker compose up -d
#   docker compose down          # stop, keep data
#   docker compose down -v       # stop and DELETE the volume

services:
  postgres:
    image: postgres:16
    container_name: knowledgeos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowledgeos
      POSTGRES_PASSWORD: knowledgeos
      POSTGRES_DB: knowledgeos
    ports:
      - "5432:5432"
    volumes:
      - knowledgeos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgeos -d knowledgeos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  knowledgeos-pgdata:
